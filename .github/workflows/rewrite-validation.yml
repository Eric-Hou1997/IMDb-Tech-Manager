name: Rewrite validation (not a release)
on:
  workflow_dispatch:
  push:
    branches: [v5.0.0-rewrite]
  pull_request:
    branches: [v5.0.0-rewrite]
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve frozen source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rewrite/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev libxdo-dev rpm xvfb dbus-x11
      - name: Toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Frozen entrypoint inventory
        run: python tools/rewrite/inventory.py
      - name: Independent Rust business contracts
        working-directory: rewrite/src-tauri
        run: cargo test --locked -p itm-core --features write-prototype --target ${{ matrix.target }}
      - name: Generated TypeScript contract drift
        working-directory: rewrite/src-tauri
        run: cargo run --locked -q -p itm-core --example export_types -- --check ../src/contracts.ts
      - name: Legacy and Rust differential behavior
        if: runner.os == 'macOS'
        working-directory: rewrite/src-tauri
        run: |
          cargo build --locked -p itm-core --example characterize
          /usr/bin/python3 ../../tools/rewrite/differential.py
      - name: Dependencies and frontend checks
        working-directory: rewrite
        run: |
          npm ci
          npm run build
      - name: Rust formatting and lint
        working-directory: rewrite/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build isolated validation bundles
        working-directory: rewrite
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Validate required package inventory
        run: python tools/rewrite/check_artifacts.py --target ${{ matrix.target }}
      - name: macOS installed DMG startup and cleanup
        if: runner.os == 'macOS'
        run: python3 tools/rewrite/macos_smoke.py
      - name: Windows NSIS install, startup, reinstall and uninstall
        if: runner.os == 'Windows'
        run: python tools/rewrite/package_smoke.py --target ${{ matrix.target }}
      - name: Linux AppImage native startup on virtual desktop
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a dbus-run-session -- python3 tools/rewrite/package_smoke.py --target ${{ matrix.target }}
      - name: Upload native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITM-runtime-${{ matrix.target }}
          path: |
            build/rewrite/native-smoke.json
            build/rewrite/package-smoke.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Original Windows engine behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Output 'ITM original engine baseline is macOS/Python; see the baseline report. Windows business migration is pending.'
      - uses: actions/upload-artifact@v4
        with:
          name: ITM-validation-${{ matrix.target }}
          path: rewrite/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 3
# No secrets, signing, GitHub Release, tag or publication. Build success does not certify native install/UI/update.
